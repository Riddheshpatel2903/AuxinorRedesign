server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Character set
    charset utf-8;

    # Logging
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Health check endpoint (Laravel built-in /up route)
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM via Unix socket
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        include fastcgi_params;

        fastcgi_param  PATH_INFO          $fastcgi_path_info;
        fastcgi_param  SERVER_PORT        $server_port;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Timeouts for long-running requests
        fastcgi_read_timeout   120s;
        fastcgi_send_timeout   120s;
        fastcgi_connect_timeout 5s;

        # Buffers
        fastcgi_buffer_size    128k;
        fastcgi_buffers        8 128k;
    }

    # Static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to PHP files outside public
    location ~ ^/(vendor|app|config|database|routes|storage|bootstrap)/ {
        deny all;
        return 404;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
